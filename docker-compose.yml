services:
  postgres:
    image: postgres:16-alpine
    container_name: silvercurrent-postgres
    environment:
      POSTGRES_USER: silvercurrent
      POSTGRES_PASSWORD: silvercurrent
      POSTGRES_DB: silvercurrent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silvercurrent"]
      interval: 5s
      timeout: 5s
      retries: 5

  chroma:
    image: chromadb/chroma:latest
    container_name: silvercurrent-chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: silvercurrent-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://silvercurrent:silvercurrent@postgres:5432/silvercurrent
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: silvercurrent-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  chroma_data:
